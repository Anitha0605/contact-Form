<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="style.css">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
    <body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="contact-wrapper">
          <div class="row g-0">
            <div class="col-md-5">
              <div class="contact-info  h-100">
                <h3 class="mb-4">Get in touch</h3>
                <p class="mb-4">We'd love to hear from you. Please fill out the form or contact us using the information below.</p>

                <div class="contact-item">
                  <div class="contact-icon">
                    <img width="24" height="24" src="https://img.icons8.com/material-rounded/24/FFFFFF/marker.png" alt="marker"/>
                  </div>
                  <div>
                    <h6 class="mb-0">Address</h6>
                    <p class="mb-0">23,Avenue de Paris,<br>75012 Paris,</p>
                  </div>
                </div>

                <div class="contact-item">
                  <div class="contact-icon">
                   <img width="30" height="30" src="https://img.icons8.com/ios-glyphs/30/FFFFFF/phone--v1.png" alt="phone--v1"/>
                  </div>
                  <div>
                    <h6 class="mb-0">Phone</h6>
                    <p class="mb-0">+91 098-123-4567</p>
                  </div>
                </div>

                <div class="contact-item">
                  <div class="contact-icon">
                    <img width="30" height="30" src="https://img.icons8.com/ios-glyphs/30/FFFFFF/new-post.png" alt="new-post"/>
                  </div>
                  <div>
                    <h6 class="mb-0">Email</h6>
                    <p class="mb-0">contact@company.com</p>
                  </div>
                </div>

                <div class="social-links">
                  <h6 class="mb-3">Follow Us</h6>
                  <img width="30" height="30" src="https://img.icons8.com/ios-glyphs/30/FFFFFF/facebook-new.png" alt="facebook-new"/>
                  <img width="24" height="24" src="https://img.icons8.com/material-sharp/24/FFFFFF/twitter.png" alt="twitter"/>
                  <img width="30" height="30" src="https://img.icons8.com/ios-glyphs/30/FFFFFF/linkedin.png" alt="linkedin"/>
                  <img width="30" height="30" src="https://img.icons8.com/ios-glyphs/30/FFFFFF/instagram-new.png" alt="instagram-new"/>
                </div>
              </div>
            </div>
            
            <div class="col-md-7">
              <div class="contact-form">
                <h3 class="mb-4">Send us a message</h3>
                <form>
                  <div class="mb-3">
                      <label class="form-label">Name</label>
                      <input type="text" class="form-control" placeholder="Enter your name" required>
                    </div>

                  <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" placeholder="xxxxx@gmail.com" required>
                  </div>
                  
                  <div class="mb-3">
                    <label class="form-label">Subject</label>
                    <input type="text" class="form-control" placeholder="How can we help?" required>
                  </div>
                  
                  <div class="mb-4">
                    <label class="form-label">Message</label>
                    <textarea class="form-control" rows="5" placeholder="Your message here..." required></textarea>
                  </div>
                  
                  <button type="submit" class="btn btn-submit text-white">Send Message</button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
